name: CI

on:
  push:
    branches: [main]
  pull_request:

# Permissão mínima: só leitura do código. Nenhum segredo é usado.
permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Testes ao vivo (rede real) ficam desligados: só rodam com GARIMPO_VIVO=1.
      GARIMPO_VIVO: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Tipos
        run: npx tsc --noEmit
      - name: Testes (sem rede, sobre respostas gravadas)
        run: npx vitest run
      - name: Build
        run: npm run build

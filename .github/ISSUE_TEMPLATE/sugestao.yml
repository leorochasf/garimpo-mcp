name: Sugerir uma melhoria
description: Indique uma limitação técnica para melhorar o Garimpo, sem dados de caso.
title: "[sugestão] "
labels: ["a-triar"]
body:
  - type: markdown
    attributes:
      value: |
        ## Antes de escrever, leia
        **Não cole nesta página nenhum dado de processo**: nem número de processo, nem nome de parte, nem trecho
        de decisão, de petição ou de caso concreto, nem caminho local do seu computador, nem senha ou chave.
        Esta página é pública. Descreva apenas a **versão**, a **ferramenta** e o **tipo de erro**.
        Use também um título genérico, sem informação de caso concreto.
  - type: checkboxes
    id: confirmacao
    attributes:
      label: Confirmação
      options:
        - label: Não incluí número de processo, nome de parte, trecho de caso, caminho local nem credencial.
          required: true
  - type: input
    id: versao
    attributes:
      label: Versão do Garimpo
      description: Informe somente a versão; não cole a saída de comandos nem caminhos locais.
      placeholder: "0.5.0"
    validations:
      required: true
  - type: dropdown
    id: ferramenta
    attributes:
      label: Ferramenta do Garimpo em que ocorreu
      options:
        - Não sei dizer
        - Pesquisa de jurisprudência
        - Download de inteiro teor
        - Leitura do inteiro teor
        - Precedentes / art. 927
        - Outra
    validations:
      required: true
  - type: dropdown
    id: tipo
    attributes:
      label: Tipo de erro
      options:
        - Mensagem de erro inesperado
        - Serviço pausado ou recusa do site
        - Resultado vazio quando deveria haver resultado
        - Resultado claramente errado
        - Lentidão ou travamento
        - Outro
    validations:
      required: true
